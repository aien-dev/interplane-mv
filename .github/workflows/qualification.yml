name: qualification (manual, needs a live model endpoint)
on:
  workflow_dispatch:
    inputs:
      endpoint: {description: "OpenAI-compatible base URL", required: true}
      model: {description: "model id", required: true}
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable at pin time; version comes from toolchain:
        with: {toolchain: "1.99.0"}
      # Dispatch inputs are data, never shell source. The probe key remains step-local.
      - run: cd rust && cargo run -q -p interplane-probe -- --endpoint "$PROBE_ENDPOINT" --model "$PROBE_MODEL" --out ../probe-report.json
        env:
          PROBE_ENDPOINT: ${{ inputs.endpoint }}
          PROBE_MODEL: ${{ inputs.model }}
          INTERPLANE_PROBE_API_KEY: ${{ secrets.INTERPLANE_PROBE_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: probe-report, path: probe-report.json}
